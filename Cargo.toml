[package]
name = "turbofish-deluxe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "jpeg"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.11.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
